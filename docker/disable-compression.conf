# Disable compression for sensitive endpoints to mitigate BREACH
<IfModule mod_deflate.c>
    # Disable compression for /user/register
    SetEnvIf Request_URI "/user/register" no-gzip
    SetEnvIf Request_URI "/user/register" no-deflate
    # Optionally, disable for other sensitive endpoints
    # SetEnvIf Request_URI "/user/login" no-gzip
    # SetEnvIf Request_URI "/user/password" no-gzip
    
    # Prevent compression if the no-gzip or no-deflate env is set
    DeflateFilterNote Input instream
    DeflateFilterNote Output outstream
    DeflateFilterNote Ratio ratio
    
    # Remove compression for matching requests
    AddOutputFilterByType DEFLATE text/html text/plain text/xml
    
    # Disable compression if env is set
    SetEnvIfNoCase no-gzip ^1$ no-gzip
    SetEnvIfNoCase no-deflate ^1$ no-deflate
</IfModule>
